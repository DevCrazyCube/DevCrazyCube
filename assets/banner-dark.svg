<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Joyren Terken. I build by directing AI coding agents, and I check what they make.">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1424"/><stop offset="1" stop-color="#131b31"/></linearGradient></defs>
<rect x="1" y="1" width="1198" height="318" rx="22" fill="url(#g)" stroke="#27304a" stroke-width="2"/>
<rect x="60" y="56" width="34" height="6" rx="3" fill="#8aa3ff"/>
<rect x="100" y="56" width="10" height="6" rx="3" fill="#f2b632"/>
<text x="60" y="122" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5" fill="#f1f3fa">Joyren Terken</text>
<text x="60" y="164" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#a4adc6">I build by directing AI coding agents,</text>
<text x="60" y="196" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#a4adc6">and I <tspan font-weight="700" fill="#8aa3ff">check</tspan> what they make.</text>
<rect x="60" y="232" width="124" height="34" rx="17" fill="#182039" stroke="#2c3757" stroke-width="1.5"/><text x="122.0" y="254.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f1f3fa">Claude skills</text><rect x="194" y="232" width="80" height="34" rx="17" fill="#182039" stroke="#2c3757" stroke-width="1.5"/><text x="234.0" y="254.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f1f3fa">Python</text><rect x="284" y="232" width="106" height="34" rx="17" fill="#182039" stroke="#2c3757" stroke-width="1.5"/><text x="337.0" y="254.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f1f3fa">TypeScript</text><rect x="400" y="232" width="146" height="34" rx="17" fill="#182039" stroke="#2c3757" stroke-width="1.5"/><text x="473.0" y="254.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f1f3fa">the Netherlands</text>
<rect x="716" y="46" width="438" height="228" rx="14" fill="#070b16"/><path d="M716,60 a14,14 0 0 1 14,-14 h410 a14,14 0 0 1 14,14 v22 h-438 z" fill="#141c33"/><circle cx="738" cy="64" r="5" fill="#f26d6d"/><circle cx="756" cy="64" r="5" fill="#f2b632"/><circle cx="774" cy="64" r="5" fill="#4fd08a"/><text x="740" y="114" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#e7ebf7"><tspan fill="#f2b632">$</tspan> is it done?</text><polyline points="742,146 747,151 756,140" fill="none" stroke="#4fd08a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="770" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#e7ebf7">the tests ran</text><polyline points="742,178 747,183 756,172" fill="none" stroke="#4fd08a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="770" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#e7ebf7">the output was read back</text><polyline points="742,210 747,215 756,204" fill="none" stroke="#4fd08a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="770" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#e7ebf7">what was not checked is written down</text><path d="M743,236 l11,11 M754,236 l-11,11" fill="none" stroke="#f0a13a" stroke-width="2.6" stroke-linecap="round"/><text x="770" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#7f89a8">&quot;trust me&quot;</text>
