# Recounts the stats card (assets/stats-*.svg) once a week, and on demand from the Actions tab.
# It commits only when a number changed, not just the date.
name: Stats

on:
  schedule:
    - cron: "23 5 * * 1" # Mondays, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  recount:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Count the public repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp assets/stats.json "$RUNNER_TEMP/before.json"
          python3 tools/stats.py "${{ github.repository_owner }}" assets

      - name: Commit when a number changed
        run: |
          changed=$(python3 - "$RUNNER_TEMP/before.json" assets/stats.json <<'PY'
          import json, sys
          a, b = (json.load(open(p)) for p in sys.argv[1:3])
          a.pop("counted", None); b.pop("counted", None)
          print("yes" if a != b else "no")
          PY
          )
          if [ "$changed" = "no" ]; then
            echo "No number changed; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-light.svg assets/stats-dark.svg assets/stats.json
          git commit -m "Stats: recount"
          git push
